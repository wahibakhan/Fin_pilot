[project]
name = "finpilot-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.0",
    "langchain>=0.3",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# B008: Depends(...) in argument defaults is the standard FastAPI DI pattern, not a bug.
# BLE001: broad except is intentional in health-check/DB-reachability probes.
ignore = ["B008", "BLE001"]
